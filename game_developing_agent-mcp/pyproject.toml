# Modified for game_developing_agent, 2026: local development workflow and runtime integration.
[project]
name = "game_developing_agent-mcp"
version = "0.1.0rc1"
description = "Agent-native MCP server for game_developing_agent: image/video generation, post-processing, and gameplay verification tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "game_developing_agent Contributors" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "requests>=2.31",
    "Pillow>=10.0",
    "numpy>=1.26",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
# Optional local background removal (RMBG-2.0 / BiRefNet). Install with
# `uv sync --extra local-rmbg`.
local-rmbg = [
    "torch",
    "torchvision",
    "transformers",
    "timm",
    "kornia",
    "einops",
    "scikit-image",
]

[project.scripts]
game_developing_agent-mcp = "game_developing_agent_mcp.cli:main"
game_developing_agent = "game_developing_agent_mcp.local.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/py"]
pythonpath = ["tests/py"]
