<!-- Modified for game_developing_agent, 2026: local development workflow and runtime integration. -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陨石躲避 · GAME_DEVELOPING_AGENT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070d19;color:#dce9f8;font-family:system-ui,sans-serif;display:grid;place-content:center;gap:14px;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:21px;letter-spacing:.12em;margin:0}small{color:#8296b2}#game{max-width:800px;width:min(800px,94vw);aspect-ratio:4/3;box-shadow:0 0 70px #142a4c;border:1px solid #294461;border-radius:12px;overflow:hidden}canvas{display:block}nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}button,select{background:#14243a;color:#e7f2ff;border:1px solid #365673;border-radius:6px;padding:8px 12px;font:inherit;font-size:13px}button:hover{background:#244060}button:focus-visible,select:focus-visible{outline:2px solid #5fdcdd}footer{font-size:12px;color:#8296b2;max-width:800px;line-height:1.6}#notice{color:#f7c47b;min-height:1em}
</style></head><body>
<header><div><h1>陨石躲避</h1><small>METEOR RUN / 生存挑战</small></div><small>坚持 60 秒 · 3 点生命</small></header>
<div id="game" aria-label="陨石躲避游戏画布"></div>
<nav><label>难度 <select id="difficulty"><option value="easy">简单</option><option value="normal" selected>普通</option><option value="hard">困难</option></select></label><label>Seed <select id="seed"><option>17</option><option selected>42</option><option>2026</option></select></label><button id="start">开始 / Enter</button><button id="pause">暂停 / P</button><button id="restart">重开 / R</button><button id="export">导出试玩 JSONL</button></nav>
<footer>方向键 / WASD 移动 · P 暂停 · R 重开。受击后有 0.8 秒保护。难度与 seed 在开始或重开时生效。<div id="notice" role="status"></div></footer>
<script type="module" src="/src/main.js"></script></body></html>
